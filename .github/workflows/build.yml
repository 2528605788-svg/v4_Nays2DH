name: build-dynamic-vegetation-solver

on:
  workflow_dispatch:
  push:
    branches:
      - feature/dynamic-vegetation

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout upstream baseline for IFX diagnosis
        uses: actions/checkout@v4
        with:
          repository: iRICsolvers/v4_Nays2DH
          ref: main
          path: .baseline

      - name: Cache Intel oneAPI installer
        uses: actions/cache@v4
        with:
          path: .cache/oneapi
          key: intel-oneapi-fortran-windows-2026.1.0.191

      - name: Install Intel oneAPI Fortran compiler
        shell: cmd
        run: |
          if not exist .cache\oneapi mkdir .cache\oneapi
          scripts\install_oneapi_windows.bat .cache\oneapi\intel-oneapi-toolkit-2026.1.0.191_offline.exe

      - name: Run source contract tests
        shell: pwsh
        run: python -m unittest tests/test_solver_contract.py -v

      - name: Compile with ifx
        shell: cmd
        run: |
          make.bat
          scripts\build_ifx_baseline.bat

      - name: Collect Intel runtime libraries
        shell: pwsh
        run: scripts\collect_intel_runtimes.ps1 -Executable install\Nays2DH.exe -Destination install

      - name: Verify solver executable
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "install/Nays2DH.exe")) {
            throw "install/Nays2DH.exe was not produced"
          }
          if ((Get-Item -LiteralPath "install/Nays2DH.exe").Length -le 0) {
            throw "install/Nays2DH.exe is empty"
          }

      - name: Assemble standalone solver folder
        shell: pwsh
        run: |
          $package = "package/iRICsolvers_v4_Nays2DH_Vegetation"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item -Path "install/*" -Destination $package -Recurse -Force
          Copy-Item -LiteralPath "LICENSE" -Destination $package -Force

      - name: Upload standalone iRIC solver
        uses: actions/upload-artifact@v4
        with:
          name: iRICsolvers_v4_Nays2DH_Vegetation
          path: package/iRICsolvers_v4_Nays2DH_Vegetation
          if-no-files-found: error
          retention-days: 14

      - name: Upload upstream IFX diagnostic baseline
        uses: actions/upload-artifact@v4
        with:
          name: Nays2DH-upstream-ifx-diagnostic
          path: diagnostic/Nays2DHBaseline.exe
          if-no-files-found: error
          retention-days: 3
